<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIWS 区块链监控面板</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .metric-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .metric-unit {
            font-size: 0.9em;
            color: #999;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status-synced {
            background: #10b981;
            color: white;
        }
        
        .status-syncing {
            background: #f59e0b;
            color: white;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        
        .last-update {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 50px;
        }
        
        .error {
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AIWS 区块链监控面板</h1>
            <p>实时监控 AIWS DevNet 3 区块链状态</p>
        </div>
        
        <div id="loading" class="loading">
            正在加载数据...
        </div>
        
        <div id="error" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">当前区块高度</div>
                    <div class="metric-value" id="blockHeight">-</div>
                    <div class="metric-unit">blocks</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label">连接节点数</div>
                    <div class="metric-value" id="nodeCount">-</div>
                    <div class="metric-unit">nodes</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label">交易池大小</div>
                    <div class="metric-value" id="txPoolSize">-</div>
                    <div class="metric-unit">transactions</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-label">同步状态</div>
                    <div class="metric-value" id="syncStatus">-</div>
                    <span id="syncBadge" class="status-badge">检查中...</span>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">📈 区块高度趋势</div>
                <canvas id="blockHeightChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">🔗 节点连接数趋势</div>
                <canvas id="nodeCountChart"></canvas>
            </div>
            
            <div class="last-update">
                最后更新: <span id="lastUpdate">-</span>
            </div>
        </div>
    </div>
    
    <script>
        // 数据存储
        const maxDataPoints = 20;
        const blockHeightData = {
            labels: [],
            values: []
        };
        const nodeCountData = {
            labels: [],
            values: []
        };
        
        // 图表实例
        let blockHeightChart = null;
        let nodeCountChart = null;
        
        // 解析 Prometheus 指标
        function parseMetrics(text) {
            const metrics = {};
            const lines = text.split('\n');
            
            for (const line of lines) {
                if (line.startsWith('#') || line.trim() === '') continue;
                
                const match = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\{([^}]*)\}\s+(.+)$/);
                if (match) {
                    const [, name, labels, value] = match;
                    metrics[name] = parseFloat(value);
                }
            }
            
            return metrics;
        }
        
        // 获取指标数据
        async function fetchMetrics() {
            try {
                const response = await fetch('http://localhost:9090/metrics');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const text = await response.text();
                const metrics = parseMetrics(text);
                
                return metrics;
            } catch (error) {
                console.error('获取指标失败:', error);
                throw error;
            }
        }
        
        // 更新显示
        function updateDisplay(metrics) {
            // 更新数值
            const blockHeight = metrics['aiw3_chain_block_height'] || 0;
            const nodeCount = metrics['aiw3_chain_node_count'] || 0;
            const txPoolSize = metrics['aiw3_chain_tx_pool_size'] || 0;
            const syncStatus = metrics['aiw3_chain_sync_status'] || 0;
            
            document.getElementById('blockHeight').textContent = blockHeight.toLocaleString();
            document.getElementById('nodeCount').textContent = nodeCount;
            document.getElementById('txPoolSize').textContent = txPoolSize;
            
            // 更新同步状态
            const syncStatusEl = document.getElementById('syncStatus');
            const syncBadgeEl = document.getElementById('syncBadge');
            if (syncStatus === 1) {
                syncStatusEl.textContent = '已同步';
                syncBadgeEl.textContent = '✓ 已同步';
                syncBadgeEl.className = 'status-badge status-synced';
            } else {
                syncStatusEl.textContent = '同步中';
                syncBadgeEl.textContent = '⟳ 同步中';
                syncBadgeEl.className = 'status-badge status-syncing';
            }
            
            // 更新时间戳
            const now = new Date();
            const timeLabel = now.toLocaleTimeString('zh-CN');
            
            // 添加到历史数据
            blockHeightData.labels.push(timeLabel);
            blockHeightData.values.push(blockHeight);
            nodeCountData.labels.push(timeLabel);
            nodeCountData.values.push(nodeCount);
            
            // 限制数据点数量
            if (blockHeightData.labels.length > maxDataPoints) {
                blockHeightData.labels.shift();
                blockHeightData.values.shift();
                nodeCountData.labels.shift();
                nodeCountData.values.shift();
            }
            
            // 更新图表
            updateCharts();
            
            // 更新最后更新时间
            document.getElementById('lastUpdate').textContent = now.toLocaleString('zh-CN');
            
            // 显示内容
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
        
        // 初始化图表
        function initCharts() {
            const blockHeightCtx = document.getElementById('blockHeightChart').getContext('2d');
            blockHeightChart = new Chart(blockHeightCtx, {
                type: 'line',
                data: {
                    labels: blockHeightData.labels,
                    datasets: [{
                        label: '区块高度',
                        data: blockHeightData.values,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 2.5,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
            
            const nodeCountCtx = document.getElementById('nodeCountChart').getContext('2d');
            nodeCountChart = new Chart(nodeCountCtx, {
                type: 'line',
                data: {
                    labels: nodeCountData.labels,
                    datasets: [{
                        label: '节点数',
                        data: nodeCountData.values,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    aspectRatio: 2.5,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        // 更新图表
        function updateCharts() {
            if (blockHeightChart) {
                blockHeightChart.data.labels = blockHeightData.labels;
                blockHeightChart.data.datasets[0].data = blockHeightData.values;
                blockHeightChart.update('none');
            }
            
            if (nodeCountChart) {
                nodeCountChart.data.labels = nodeCountData.labels;
                nodeCountChart.data.datasets[0].data = nodeCountData.values;
                nodeCountChart.update('none');
            }
        }
        
        // 显示错误
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.innerHTML = `<strong>❌ 错误:</strong> ${message}`;
            errorEl.style.display = 'block';
            document.getElementById('loading').style.display = 'none';
        }
        
        // 主循环
        async function mainLoop() {
            try {
                const metrics = await fetchMetrics();
                updateDisplay(metrics);
            } catch (error) {
                showError(`无法连接到监控服务: ${error.message}<br>请确保监控服务正在运行在 http://localhost:9090`);
            }
        }
        
        // 启动
        window.addEventListener('load', async () => {
            initCharts();
            await mainLoop();
            
            // 每 5 秒刷新一次
            setInterval(mainLoop, 5000);
        });
    </script>
</body>
</html>
