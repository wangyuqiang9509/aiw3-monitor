apiVersion: 1

groups:
  - orgId: 1
    name: AIWS Blockchain Alerts
    folder: AIWS Monitor
    interval: 1m
    rules:
      # 区块高度停止增长告警
      - uid: block_height_not_increasing
        title: 区块高度停止增长
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: aiws_chain_block_height
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: increase(A[5m]) == 0
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: '区块链节点 {{ $labels.node_name }} 在过去 5 分钟内区块高度未增长，当前高度: {{ $values.A }}'
          summary: 区块高度停止增长
        labels:
          severity: critical
        isPaused: false

      # 节点连接数过低告警
      - uid: low_peer_count
        title: 节点连接数过低
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: aiws_chain_peers_count
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: B < 2
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          description: '节点 {{ $labels.node_name }} 连接的节点数为 {{ $values.A }}，低于最小值 2'
          summary: 节点连接数过低
        labels:
          severity: warning
        isPaused: false

      # 区块时间过长告警
      - uid: high_block_time
        title: 区块时间过长
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: aiws_chain_block_time_seconds
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: B > 3
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 3m
        annotations:
          description: '节点 {{ $labels.node_name }} 区块时间为 {{ $values.A }}秒，超过阈值 3秒'
          summary: 区块时间过长
        labels:
          severity: warning
        isPaused: false

      # 节点正在同步告警
      - uid: node_catching_up
        title: 节点正在同步
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: aiws_chain_catching_up
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: B == 1
              refId: C
              type: math
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: '节点 {{ $labels.node_name }} 正在同步区块，已持续 5 分钟'
          summary: 节点正在同步
        labels:
          severity: info
        isPaused: false

      # 服务不可用告警
      - uid: service_down
        title: 监控服务不可用
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="aiw3-monitor"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              expression: B == 0
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          description: 'AIWS 监控服务已停止响应超过 1 分钟'
          summary: 监控服务不可用
        labels:
          severity: critical
        isPaused: false

