global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: 'aiw3-monitor'
    environment: 'production'

# 告警规则文件
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# 抓取配置
scrape_configs:
  # AIWS Monitor 导出器 (运行在 host 上)
  - job_name: 'aiw3-monitor'
    static_configs:
      - targets: ['172.21.240.200:9090']
        labels:
          service: 'blockchain-monitor'

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# 告警管理器
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['aiw3-alertmanager:9093']

